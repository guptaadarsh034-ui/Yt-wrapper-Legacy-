apply plugin: 'com.android.application'

android {
    // Compile with an available SDK while keeping Android 4.4 as the minimum.
    compileSdkVersion 30
    buildToolsVersion "30.0.3"

    defaultConfig {
        applicationId "com.yt.wrapper"
        minSdkVersion 19
        targetSdkVersion 19
        versionCode 2
        versionName "1.1"
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
        debug {
            minifyEnabled false
        }
    }

    lintOptions {
        // This app intentionally targets API 19 to preserve Android 4.4 behavior.
        // It is distributed as a legacy sideload APK, not through Google Play.
        disable 'ExpiredTargetSdkVersion'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
