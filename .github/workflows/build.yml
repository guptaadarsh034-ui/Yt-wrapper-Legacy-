name: Build Android 4.4 APK

on:
  push:
    branches: [ "main", "master", "legacy-kitkat-optimization" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '11'

    - name: Setup Gradle 6.8.3
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '6.8.3'

    - name: Build optimized release APK
      run: gradle assembleRelease

    - name: Report APK size
      shell: bash
      run: |
        APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
        if [ -z "$APK" ] || [ ! -f "$APK" ]; then
          echo "ERROR: Gradle succeeded but no APK was found under app/build/outputs/apk/release/"
          find app/build/outputs -maxdepth 5 -type f -print || true
          exit 1
        fi
        BYTES="$(stat -c%s "$APK")"
        MIB="$(awk -v bytes="$BYTES" 'BEGIN {printf "%.2f", bytes/1024/1024}')"
        echo "Optimized release APK: $APK"
        echo "APK size: $BYTES bytes ($MIB MiB)"
        if [ "$BYTES" -le 1048576 ]; then
          echo "APK is within the 1 MiB target."
        else
          echo "APK is above 1 MiB; see size report. No build failure because device compatibility is more important than an arbitrary cutoff."
        fi

    - name: Upload optimized release APK
      uses: actions/upload-artifact@v4
      with:
        name: YouTube-KitKat-512MB-Optimized-Release
        path: app/build/outputs/apk/release/*.apk
